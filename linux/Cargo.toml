[package]
name = "muzikit"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
byteorder = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.32"
pulseaudio = "0.3.2"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["ogg", "mp3", "flac", "wav", "mkv"] }
symphonia-opus = "0.1.1"
zbus = "5.19"
ttf-parser = "0.25"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
getrandom = "0.3"
mdns-sd = "0.21.7"
ureq = { version = "3.5.2", default-features = false }
aes-gcm = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
